stages:
  - test
  - build
  - release

# Cache node_modules and Rust registry
cache:
  key:
    files:
      - pnpm-lock.yaml
      - src-tauri/Cargo.toml
  paths:
    - .pnpm-store/
    - src-tauri/target/

# CI linting & check job (runs on any branch push)
lint_and_check:
  stage: test
  image: node:22-bookworm
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - npm install -g pnpm@10
  script:
    - pnpm config set store-dir .pnpm-store
    - pnpm install
    - pnpm lint
    - pnpm build
    - cargo check --manifest-path src-tauri/Cargo.toml

# =========================================================================
# Build Jobs (Runs only on tags starting with v*)
# =========================================================================

# Linux Build
build:linux:
  stage: build
  image: node:22-bookworm
  tags:
    - linux
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+/
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - npm install -g pnpm@10
  script:
    - pnpm config set store-dir .pnpm-store
    - pnpm install
    - node scripts/sync-version.js
    - pnpm build
    - pnpm exec tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 1 week

# macOS Build (Requires a macOS runner with 'macos' tag)
build:macos:
  stage: build
  tags:
    - macos
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+/
  script:
    - npm install -g pnpm@10
    - pnpm install
    - node scripts/sync-version.js
    - pnpm build
    # Build for both architectures on macOS
    - pnpm exec tauri build --target aarch64-apple-darwin
    - pnpm exec tauri build --target x86_64-apple-darwin
  artifacts:
    paths:
      - src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    expire_in: 1 week

# Windows Build (Requires a Windows runner with 'windows' tag)
build:windows:
  stage: build
  tags:
    - windows
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+/
  script:
    - npm install -g pnpm@10
    - pnpm install
    - node scripts/sync-version.js
    - pnpm build
    - pnpm exec tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
    expire_in: 1 week

# =========================================================================
# Release Job (Runs on tags and uploads assets to GitLab Release Page)
# =========================================================================
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - linux
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+/
  dependencies:
    - build:linux
    - build:macos
    - build:windows
  script:
    - echo "Publishing Release $CI_COMMIT_TAG to GitLab"
  release:
    name: 'MXray $CI_COMMIT_TAG'
    description: 'MXray 跨平台客户端最新构建程序包'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Windows MSI Installer'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/src-tauri/target/release/bundle/msi/MXray_${CI_COMMIT_TAG}_x64_en-US.msi?job=build:windows'
        - name: 'Windows NSIS Setup'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/src-tauri/target/release/bundle/nsis/MXray_${CI_COMMIT_TAG}_x64-setup.exe?job=build:windows'
        - name: 'macOS Apple Silicon DMG'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/MXray_${CI_COMMIT_TAG}_aarch64.dmg?job=build:macos'
        - name: 'macOS Intel DMG'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/MXray_${CI_COMMIT_TAG}_x64.dmg?job=build:macos'
        - name: 'Linux DEB'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/src-tauri/target/release/bundle/deb/mxray_${CI_COMMIT_TAG}_amd64.deb?job=build:linux'
        - name: 'Linux AppImage'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/src-tauri/target/release/bundle/appimage/mxray_${CI_COMMIT_TAG}_amd64.AppImage?job=build:linux'

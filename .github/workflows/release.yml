name: 'Release MXray'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # -----------------------------------------------------------------------
      # Sync Version
      # -----------------------------------------------------------------------
      # Extracts the semver version from the Git tag (e.g., v1.2.3 -> 1.2.3)
      # and updates it dynamically in package.json, tauri.conf.json, and Cargo.toml
      # so that the built application packages match the release version.
      - name: Sync version from Git Tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "GITHUB_REF_NAME '$GITHUB_REF_NAME' is not a valid semver tag, keeping versions in config files."
            exit 0
          fi
          echo "Building version: $VERSION"
          node -e "
            const fs = require('fs');
            const version = '$VERSION';

            // 1. package.json
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            // 2. src-tauri/tauri.conf.json
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');

            // 3. src-tauri/Cargo.toml（仅替换 [package] 中位于行首的 version 字段）
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version\\s*=\\s*\\\"[^\\\"]*\\\"/m, 'version = \\\"' + version + '\\\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);

            console.log('Successfully updated versions in package.json, tauri.conf.json, and Cargo.toml to ' + version);
          "

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Configure sccache & Rust flags
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          work-dir: 'src-tauri'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Start Xvfb virtual display (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend static assets
        run: pnpm build

      - name: Build Tauri app and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'MXray v__VERSION__'
          releaseBody: 'MXray 跨平台客户端最新构建程序包'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
